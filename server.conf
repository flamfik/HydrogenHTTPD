# HydrogenHttpd v0.8 config

port = 8080

enable_tls = false
tls_port = 8443
tls_cert_file = certs/server.crt
tls_key_file = certs/server.key

default_root = www

access_log = logs/access.log
error_log = logs/error.log

max_request_bytes = 16384
rate_limit_per_minute = 120
read_timeout_seconds = 5

worker_threads = 4
max_pending_connections = 256

enable_htaccess = true
htaccess_filename = .htaccess
max_htaccess_depth = 8

# PHP module.
# Secure design: PHP is delegated to PHP-FPM / FastCGI.
# HydrogenHttpd does NOT execute php-cgi through shell and does NOT spawn PHP processes.
enable_php = false
php_extension = .php
php_fastcgi_host = 127.0.0.1
php_fastcgi_port = 9000
php_fastcgi_connect_timeout_seconds = 3
php_fastcgi_read_timeout_seconds = 10

# SQL module.
# SQLite support is intended for app data and structured server metadata.
# Never expose arbitrary SQL from HTTP requests.
enable_sql = false
sqlite_database = sql/hydrogen.db

vhost.localhost = www
vhost.127.0.0.1 = www
