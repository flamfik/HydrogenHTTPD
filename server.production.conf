# HydrogenHttpd v1.9.0 hardened production profile
# Replace cert paths and document root before deployment.

port = 80

enable_tls = true
tls_port = 443
public_https_port = 443
tls_cert_file = certs/fullchain.pem
tls_key_file = certs/privkey.pem
force_https = true
https_redirect_status = 308
expose_server_header = false

default_root = www
access_log = logs/access.log
error_log = logs/error.log
audit_log = logs/audit.log
audit_rotate_bytes = 10485760
audit_rotate_keep = 5

max_request_bytes = 16384
max_body_bytes = 1048576
max_header_line_bytes = 4096
max_headers = 100
max_uri_bytes = 2048
max_method_bytes = 16
rate_limit_per_minute = 120

# High-load runtime tuning.
enable_rate_limiter = true
rate_limiter_shards = 64
io_threads = 2
worker_threads = 0
worker_thread_multiplier = 4
max_pending_connections = 4096
listen_backlog = 4096
tcp_no_delay = true
tcp_keep_alive = true
socket_receive_buffer_bytes = 0
socket_send_buffer_bytes = 0

# Access logging is queued and written in batches.
async_access_log = true
enable_access_log = true
access_log_sample_rate = 1
access_log_queue_capacity = 65536
access_log_flush_interval_ms = 100

# In-process static file cache.
enable_static_cache = true
static_cache_shards = 32
static_cache_max_entries = 4096
static_cache_max_bytes = 268435456
static_cache_max_file_bytes = 4194304
static_cache_revalidate_ms = 1000
static_cache_control = public, max-age=60
read_timeout_seconds = 5


deny_hidden_files = true
allow_dot_well_known = true
block_sensitive_files = true

# Keep disabled unless you need it. The supported subset is intentionally tiny.
enable_htaccess = false
htaccess_filename = .htaccess
max_htaccess_depth = 8

# Keep disabled unless PHP-FPM is isolated and configured separately.
enable_php = false
php_extension = .php
php_fastcgi_host = 127.0.0.1
php_fastcgi_port = 9000
php_fastcgi_connect_timeout_seconds = 3
php_fastcgi_read_timeout_seconds = 10

# Internal module only. No SQL-over-HTTP endpoint exists.
enable_sql = false
# Upload module.
# Disabled by default. Uploads are written to upload_directory and are not served as static files.
enable_uploads = false
upload_endpoint = /__hydrogen/upload
upload_directory = uploads
upload_spool_directory = tmp/uploads
max_multipart_parts = 16
max_upload_file_bytes = 1048576
max_upload_field_bytes = 16384

sqlite_database = sql/hydrogen.db

vhost.example.com = www
# Endpoint authorization.
# Store SHA-256 token rules in secrets/auth.tokens.
auth_secrets_file = secrets/auth.tokens
auth_hot_reload = true
auth_reload_interval_seconds = 1
enable_endpoint_auth = false
auth_bearer_token =

# Protected operational status endpoint.
enable_admin_status = false
admin_status_endpoint = /__hydrogen/admin/status
