# HydrogenHttpd v1.9.0 high-load profile
# Tune after measuring on the target host. Designed for use behind a load balancer/reverse proxy.

port = 8080
enable_tls = false
force_https = false
expose_server_header = false

default_root = www
access_log = logs/access.log
error_log = logs/error.log
audit_log = logs/audit.log
audit_rotate_bytes = 10485760
audit_rotate_keep = 5

max_request_bytes = 16384
max_body_bytes = 1048576
max_header_line_bytes = 4096
max_headers = 100
max_uri_bytes = 2048
max_method_bytes = 16
read_timeout_seconds = 3

# Disable only when a trusted upstream enforces rate limits.
enable_rate_limiter = false
rate_limit_per_minute = 100000
rate_limiter_shards = 128

# 0 auto-selects hardware_concurrency * worker_thread_multiplier.
io_threads = 4
worker_threads = 0
worker_thread_multiplier = 8
max_pending_connections = 16384
listen_backlog = 16384
tcp_no_delay = true
tcp_keep_alive = true
socket_receive_buffer_bytes = 0
socket_send_buffer_bytes = 0

# For maximum throughput disable access logging, or sample it.
async_access_log = true
enable_access_log = true
access_log_sample_rate = 10
access_log_queue_capacity = 262144
access_log_flush_interval_ms = 100

enable_static_cache = true
static_cache_shards = 64
static_cache_max_entries = 16384
static_cache_max_bytes = 536870912
static_cache_max_file_bytes = 8388608
static_cache_revalidate_ms = 2000
static_cache_control = public, max-age=300

deny_hidden_files = true
allow_dot_well_known = true
block_sensitive_files = true
enable_htaccess = false

enable_php = false
enable_sql = false
enable_uploads = false
enable_endpoint_auth = false
enable_admin_status = false

vhost.localhost = www
vhost.127.0.0.1 = www
