name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  linux:
    name: Linux / GCC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            libboost-system-dev \
            libssl-dev \
            libsqlite3-dev \
            python3 \
            openssl

      - name: Configure
        run: |
          cmake -S . -B build \
            -DHYDROGENHTTPD_BUILD_TESTS=ON \
            -DHYDROGENHTTPD_ENABLE_TLS=ON \
            -DHYDROGENHTTPD_ENABLE_SQLITE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  linux-no-tls:
    name: Linux / no TLS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libboost-system-dev libsqlite3-dev python3

      - name: Configure
        run: |
          cmake -S . -B build \
            -DHYDROGENHTTPD_BUILD_TESTS=ON \
            -DHYDROGENHTTPD_ENABLE_TLS=OFF \
            -DHYDROGENHTTPD_ENABLE_SQLITE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure
