name: Feature request
description: Suggest a new feature or improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this feature solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the feature.
    validations:
      required: true

  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: Could this increase attack surface?
